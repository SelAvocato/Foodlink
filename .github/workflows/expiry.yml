name: Expiry

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expiry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  expire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Expire due donations
        run: |
          response=$(curl -sS -o body.json -w "%{http_code}" -X POST "${{ secrets.CRON_BASE_URL }}/api/cron/expire-donations" -H "authorization: Bearer ${{ secrets.CRON_SECRET }}" -H "content-type: application/json")
          cat body.json
          [ "$response" = "200" ]

  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.schedule == '0 3 * * *'
    steps:
      - name: Daily cleanup
        run: |
          response=$(curl -sS -o body.json -w "%{http_code}" -X POST "${{ secrets.CRON_BASE_URL }}/api/cron/cleanup" -H "authorization: Bearer ${{ secrets.CRON_SECRET }}" -H "content-type: application/json")
          cat body.json
          [ "$response" = "200" ]

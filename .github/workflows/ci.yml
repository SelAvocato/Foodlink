name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DIRECT_URL: postgresql://postgres:dev@localhost:5433/foodlink
      DATABASE_URL: postgresql://postgres:dev@localhost:5433/foodlink
      AUTH_SECRET: super_secret_random_string_at_least_thirty_two_characters_long
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SUPABASE_URL: https://supabase.co
      SUPABASE_PUBLISHABLE_KEY: mock-publishable-key
      SUPABASE_SECRET_KEY: mock-secret-key
      SUPABASE_JWKS_URL: https://supabase.co/functions/v1/auth/v1/jwks
      SUPABASE_STORAGE_BUCKET: foodlink-uploads
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: foodlink
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d foodlink"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DIRECT_URL: postgresql://postgres:dev@localhost:5433/foodlink
      DATABASE_URL: postgresql://postgres:dev@localhost:5433/foodlink
      SUPABASE_URL: https://supabase.co
      SUPABASE_PUBLISHABLE_KEY: mock-publishable-key
      SUPABASE_SECRET_KEY: mock-secret-key
      SUPABASE_JWKS_URL: https://supabase.co/functions/v1/auth/v1/jwks
      SUPABASE_STORAGE_BUCKET: foodlink-uploads
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run db:check